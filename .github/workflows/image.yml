name: image

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    # BE 테스트는 Testcontainers(PostgreSQL)를 사용 → ubuntu-latest엔 Docker가
    # 이미 깔려 있어 별도 service container 없이 동작함. 단, 통합 테스트 비중이
    # 높아 (~23개 @SpringBootTest) 첫 실행은 2~4분 소요됨.
    steps:
      # 계약 테스트(src/test/resources/openapi/openapi.yaml)는 FE 저장소의 스펙을
      # 가리키는 심볼릭 링크다 — 원본을 한 벌만 두려는 것이라 CI에서도 FE를 옆에
      # 받아 둔다. 링크가 저장소 바깥(../home-jaram-fe)을 보므로 두 저장소를
      # 작업공간 아래 형제로 놓는다.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: home-jaram-be

      - name: Checkout frontend spec
        uses: actions/checkout@v4
        with:
          repository: jaram-plus/home-jaram-fe
          ref: develop
          path: home-jaram-fe

      # 계약을 함께 고치는 작업은 두 저장소가 같은 브랜치 이름을 쓴다. 그런 브랜치가
      # 있으면 그쪽 스펙을 봐야 한다 — develop 만 보면 아직 머지되지 않은 새 경로가
      # 스펙에 없어 짝 PR 이 늘 빨간불이 된다.
      - name: Pick matching spec branch
        working-directory: home-jaram-fe
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch --depth 1 origin "$branch"
            git checkout FETCH_HEAD
            echo "스펙 출처: home-jaram-fe@$branch"
          else
            echo "스펙 출처: home-jaram-fe@develop"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: home-jaram-be

      - name: Run tests
        working-directory: home-jaram-be
        run: ./gradlew test --no-daemon

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # dev 자동 배포 (develop 브랜치 push 시).
  # VM의 self-hosted runner가 /srv/jaram/infra 에서 deploy script 실행.
  # runner가 docker group 멤버라 별도 ssh 불필요. image는 public이라 login 생략.
  deploy-dev:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, linux, x64, jaram-vm, deploy]
    timeout-minutes: 5
    steps:
      - name: Deploy on VM (compose pull + up)
        run: |
          cd /srv/jaram/infra
          ./scripts/deploy-backend.sh
