name: image

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    # BE 테스트는 Testcontainers(PostgreSQL)를 사용 → ubuntu-latest엔 Docker가
    # 이미 깔려 있어 별도 service container 없이 동작함. 단, 통합 테스트 비중이
    # 높아 (~23개 @SpringBootTest) 첫 실행은 2~4분 소요됨.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --no-daemon

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # dev 자동 배포 (develop 브랜치 push 시).
  # VM의 self-hosted runner가 /srv/jaram/infra 에서 deploy script 실행.
  # runner가 docker group 멤버라 별도 ssh 불필요. image는 public이라 login 생략.
  deploy-dev:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: [self-hosted, linux, x64, jaram-vm, deploy]
    timeout-minutes: 5
    steps:
      - name: Deploy on VM (compose pull + up)
        run: |
          cd /srv/jaram/infra
          ./scripts/deploy-backend.sh
