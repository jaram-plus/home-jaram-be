openapi: 3.1.0
info:
  title: JARAM Web API
  version: 0.1.0
  description: >
    JARAM(자람) 웹 백엔드 계약. FE 레포에서 파생된 단일 진실원이며 Spring Boot 백엔드가 구현한다.
    설계·usecase·결정 근거는 docs/superpowers/specs/2026-06-29-jaram-backend-design.md 참조.
    enum 와이어 값과 에러 코드는 FE 소비에 맞춰 고정되어 있다.
servers:
  - url: http://localhost:8080
    description: 로컬 개발 (Spring 기본 포트)
  # - url: https://api.jaram.example
  #   description: 운영 (배포 대상 확정 시 채움)

tags:
  - name: auth
    description: 인증 · 회원가입 · 비밀번호 재설정
  - name: people
    description: 회원 목록
  - name: seminar
    description: 세미나 · 출석
  - name: study
    description: 스터디 · 신청 · 승인
  - name: admin
    description: 임원 전용 관리 (회원 승인 · 목록/일괄저장 · 대시보드 · 설정 · 내보내기)

paths:
  # ─────────────────────────── auth ───────────────────────────
  /api/auth/login:
    post:
      tags: [auth]
      summary: 로그인 (UC-A2)
      description: 성공 시 JWT 발급. status≠ACTIVE 회원은 차단.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: 이메일/비밀번호 불일치 (code=INVALID)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: INVALID, message: 이메일 또는 비밀번호가 일치하지 않습니다. }
        '403':
          description: 가입 승인 대기 (code=PENDING)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: PENDING, message: 가입 승인을 기다리는 중입니다. }
        '404':
          description: 미등록 회원 (code=NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: NOT_FOUND, message: 등록된 회원 정보가 없습니다. }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /api/auth/signup:
    post:
      tags: [auth]
      summary: 회원가입 신청 (UC-A1)
      description: status=PENDING 회원 생성. 임원 승인 후 로그인 가능.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: 신청 접수됨 (승인 대기)
        '409':
          description: 이미 가입 신청된 이메일 (code=EMAIL_TAKEN)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: EMAIL_TAKEN, message: 이미 가입 신청된 이메일입니다. }
        '422': { $ref: '#/components/responses/Validation' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /api/auth/password/reset-request:
    post:
      tags: [auth]
      summary: 비밀번호 재설정 요청 (UC-A3)
      description: 이메일 존재 여부와 무관하게 200 (열거 공격 방지).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '200': { description: 요청 접수됨 }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /api/auth/password/reset:
    post:
      tags: [auth]
      summary: 비밀번호 재설정 (UC-A4)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetConfirm' }
      responses:
        '200': { description: 변경 완료 }
        '400':
          description: 토큰 무효/만료/사용됨 또는 비밀번호 규칙 위반
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  # ─────────────────────────── people ───────────────────────────
  /api/people:
    get:
      tags: [people]
      summary: 회원 목록 조회 (UC-P1)
      description: ACTIVE 회원을 탭(임원/기여자/졸업자)·그룹 구조로 반환. public.
      responses:
        '200':
          description: 탭별 그룹 구조
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeopleResponse' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  # ─────────────────────────── seminar ───────────────────────────
  /api/seminars:
    get:
      tags: [seminar]
      summary: 세미나 목록 조회 (UC-S1)
      description: status는 서버 파생. attendanceCode 미노출. public.
      responses:
        '200':
          description: 세미나 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Seminar' }
        '5XX': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [seminar]
      summary: 세미나 개설 (UC-S3)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeminarCreateRequest' }
      responses:
        '201':
          description: 개설됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Seminar' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /api/seminars/{id}/attend:
    post:
      tags: [seminar]
      summary: 출석 체크 (UC-S2)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/SeminarId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttendRequest' }
      responses:
        '200':
          description: 출석 완료 (중복 출석은 멱등)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendResult' }
        '400':
          description: 코드 불일치 또는 출석 창 닫힘 (code=INVALID_CODE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { code: INVALID_CODE, message: 출석 코드가 올바르지 않습니다. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /api/seminars/{id}/roster:
    get:
      tags: [seminar]
      summary: 출석 명단 조회 (UC-S4)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/SeminarId'
      responses:
        '200':
          description: 출석 명단
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RosterResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  # ─────────────────────────── study ───────────────────────────
  /api/studies:
    get:
      tags: [study]
      summary: 스터디 목록 조회 (UC-T1)
      description: APPROVED 스터디만. 인증 시 사용자별 apply 상태 포함. public.
      security:
        - {}
        - { bearerAuth: [] }
      responses:
        '200':
          description: 스터디 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Study' }
        '5XX': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [study]
      summary: 스터디 개설 신청 (UC-T3)
      description: approvalStatus=PENDING 비공개 스터디 생성. 신청자가 leader.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudyCreateRequest' }
      responses:
        '201':
          description: 개설 신청됨 (승인 대기)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Study' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /api/studies/{id}/apply:
    post:
      tags: [study]
      summary: 스터디 신청 (UC-T2)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/StudyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplyRequest' }
      responses:
        '201': { description: 신청 접수됨 (승인 대기) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 이미 신청함 또는 모집 마감/leader 본인
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Validation' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /api/studies/my:
    get:
      tags: [study]
      summary: 내 활동 조회 (UC-T4)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 내 신청 + 내가 개설한 스터디
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyActivity' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /api/studies/pending:
    get:
      tags: [study]
      summary: 개설 대기 목록 (UC-T5)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 승인 대기 스터디 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PendingStudy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /api/studies/{id}/approve:
    post:
      tags: [study]
      summary: 스터디 개설 승인 (UC-T6)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/StudyId'
      responses:
        '200': { description: 승인됨 (공개) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /api/studies/{id}/reject:
    post:
      tags: [study]
      summary: 스터디 개설 거절 (UC-T6)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/StudyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
      responses:
        '200': { description: 거절됨 (사유 저장) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /api/studies/applicants:
    get:
      tags: [study]
      summary: 신청자 목록 (UC-T7)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 승인 대기 신청자 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Applicant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /api/studies/applicants/{id}/approve:
    post:
      tags: [study]
      summary: 신청자 승인 (UC-T8)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicantId'
      responses:
        '200': { description: 승인됨 (cur 증가) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 정원 초과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /api/studies/applicants/{id}/reject:
    post:
      tags: [study]
      summary: 신청자 거절 (UC-T8)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ApplicantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
      responses:
        '200': { description: 거절됨 (사유 저장) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  # ─────────────────────────── admin (member approval, UC-A5) ───────────────────────────
  /api/admin/members/pending:
    get:
      tags: [admin]
      summary: 가입 승인 대기 회원 목록 (UC-A5)
      description: FE 화면 미존재 — BE 선구현.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: PENDING 회원 목록
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PendingMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /api/admin/members/{id}/approve:
    post:
      tags: [admin]
      summary: 가입 승인 (UC-A5)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200': { description: "승인됨 (status=ACTIVE, 로그인 가능)" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /api/admin/members/{id}/reject:
    post:
      tags: [admin]
      summary: 가입 거절 (UC-A5)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
      responses:
        '200': { description: 거절됨 (status=REJECTED) }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Validation' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  # ─────────────────────────── admin (management surface) ───────────────────────────
  /api/admin/{resource}:
    get:
      tags: [admin]
      summary: 관리 목록 조회 (검색·필터·정렬·페이지)
      description: >
        리소스별 행을 페이지 단위로 반환. members는 tab(member/exec/contrib/graduate)으로 세부 구분.
        임의 필터 키(grade·cohort·status·department 등)는 쿼리 파라미터로 전달하며 값은 와이어 enum 키(UPPER_SNAKE).
      security: [{ bearerAuth: [] }]
      parameters:
        - name: resource
          in: path
          required: true
          schema: { $ref: '#/components/schemas/AdminResource' }
        - { name: tab, in: query, required: false, schema: { type: string }, description: 'members 세부(member/exec/contrib/graduate)' }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: sort, in: query, required: false, schema: { type: string }, example: 'name,asc' }
        - { name: page, in: query, required: false, schema: { type: integer, default: 1 } }
        - { name: size, in: query, required: false, schema: { type: integer, default: 8 } }
      responses:
        '200':
          description: 페이지 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /api/admin/{resource}:batch:
    patch:
      tags: [admin]
      summary: 변경분 일괄 저장 (부분 성공)
      description: 인라인 편집분(updates·creates·deletes)을 한 번에 커밋. version으로 낙관적 잠금.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: resource
          in: path
          required: true
          schema: { $ref: '#/components/schemas/AdminResource' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminBatchRequest' }
      responses:
        '200':
          description: 저장 결과 (conflicts·errors 로 부분 성공 표기)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBatchResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /api/admin/dashboard/stats:
    get:
      tags: [admin]
      summary: 대시보드 지표
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 집계 지표
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /api/admin/settings:
    get:
      tags: [admin]
      summary: 학회 설정 조회
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 설정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '5XX': { $ref: '#/components/responses/ServerError' }
    patch:
      tags: [admin]
      summary: 학회 설정 수정
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSettingsUpdate' }
      responses:
        '200':
          description: 수정된 설정
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /api/admin/export/google-drive:
    post:
      tags: [admin]
      summary: 현재 목록을 Google Drive 스프레드시트로 내보내기
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriveExportRequest' }
      responses:
        '200':
          description: 생성된 파일 링크
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriveExportResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '5XX': { $ref: '#/components/responses/ServerError' }

  /api/me:
    get:
      summary: 내 정보 조회
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 내 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '5XX': { $ref: '#/components/responses/ServerError' }
    patch:
      summary: 내 정보 수정
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeUpdateRequest' }
      responses:
        '200':
          description: 수정된 내 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeProfile' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Validation' }
        '5XX': { $ref: '#/components/responses/ServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Authorization: Bearer <accessToken>'

  parameters:
    SeminarId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: 세미나 ID
    StudyId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: 스터디 ID
    ApplicantId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: 스터디 신청 ID
    MemberId:
      name: id
      in: path
      required: true
      schema: { type: string }
      description: 회원 ID

  responses:
    Unauthorized:
      description: 인증 필요/토큰 무효 (FE 세션 clear)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: 권한 부족 (officer 전용)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: FORBIDDEN, message: 접근 권한이 없습니다. }
    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Validation:
      description: 입력 검증 실패 (fieldErrors 포함)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            code: VALIDATION
            message: 입력값을 확인해 주세요.
            fieldErrors: { email: 한양대 이메일(@hanyang.ac.kr)만 사용할 수 있습니다. }
    ServerError:
      description: 서버 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { code: SERVER, message: 일시적인 오류가 발생했습니다. }

  schemas:
    # ── 공통 ──
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: 에러 코드 (FE가 분기에 사용)
        message: { type: string }
        fieldErrors:
          type: [object, 'null']
          additionalProperties: { type: string }
          description: 검증 실패 시 필드명 → 메시지
    RejectRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, description: 거절/반려 사유 (필수) }

    # ── enum ──
    Authority:
      type: string
      enum: [MEMBER, OFFICER]
    MemberDepartment:
      type: [string, 'null']
      description: 부서. enum name으로 전송 (라벨은 FE 매핑).
      enum: [LEADERSHIP, ACADEMIC, PR, FINANCE, INFRA, null]
    MemberTitle:
      type: [string, 'null']
      description: 직책(임원 배정). 등급은 MemberGrade로 분리. enum name으로 전송 (라벨은 FE 매핑).
      enum: [PRESIDENT, VICE_PRESIDENT, ACADEMIC_LEAD, ACADEMIC_MEMBER, PR_LEAD, PR_MEMBER, FINANCE_LEAD, FINANCE_MEMBER, SERVER_ADMIN, null]
    MemberGrade:
      type: string
      description: 회원 등급. 가입 승인 시 gen 파생(gen==현재년도-1984→NEWCOMER, 그 외 ASSOCIATE). enum name으로 전송.
      enum: [NEWCOMER, ASSOCIATE, REGULAR, OB]
    MemberStatus:
      type: string
      description: 활동 상태(승인축과 별개). 가입 시 SignupRequest.enrolled로 파생(true→ACTIVE, false→ON_LEAVE), 이후 admin이 변경.
      enum: [ACTIVE, ON_LEAVE, WITHDRAWN]
    MeProfile:
      type: object
      required: [id, name, email, authority]
      properties:
        id: { type: string }
        name: { type: string }
        studentId: { type: string }
        email: { type: string, format: email }
        authority: { $ref: '#/components/schemas/Authority' }
        grade: { $ref: '#/components/schemas/MemberGrade' }
        status: { $ref: '#/components/schemas/MemberStatus' }
        department: { $ref: '#/components/schemas/MemberDepartment' }
        title: { $ref: '#/components/schemas/MemberTitle' }
        gen: { type: [string, 'null'], example: '41기' }
        bio: { type: [string, 'null'] }
        githubUrl: { type: [string, 'null'], format: uri }
        blogUrl: { type: [string, 'null'], format: uri }
    MeUpdateRequest:
      type: object
      properties:
        bio: { type: [string, 'null'], maxLength: 500 }
        githubUrl: { type: [string, 'null'], format: uri }
        blogUrl: { type: [string, 'null'], format: uri }
    MemberCategory:
      type: string
      enum: [exec, contrib, grad]
    SeminarStatus:
      type: string
      enum: [UPCOMING, ONGOING, ENDED]
      description: startsAt + 출석창으로 서버 파생
    StudyStatus:
      type: string
      enum: [RECRUITING, ONGOING, CLOSED]
      description: CLOSED = 모집 마감·종료 (3상태)
    ApplyState:
      type: [string, 'null']
      enum: [OPEN, APPLIED, CLOSED, JOINED, null]
      description: 사용자별 파생. 미인증 시 null.
    ApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
    ApplicationStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    # ── auth ──
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: hong@hanyang.ac.kr }
        password: { type: string, format: password }
    UserSummary:
      type: object
      required: [id, name, email, authority]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        authority: { $ref: '#/components/schemas/Authority' }
    LoginResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken: { type: string, description: JWT }
        user: { $ref: '#/components/schemas/UserSummary' }
    SignupRequest:
      type: object
      required: [name, studentId, email, password, gen, faculty, phone, enrolled]
      properties:
        name: { type: string }
        studentId: { type: string, pattern: '^\d{8,10}$', example: '2023012345' }
        email:
          type: string
          format: email
          pattern: '@hanyang\.ac\.kr$'
          description: 한양대 이메일만 허용
        password:
          type: string
          format: password
          description: 8자 이상, 영문·숫자·기호 각 1개 이상
        gen:
          type: string
          pattern: '^\d+$'
          example: '41'
          description: 기수(숫자만). 신입생은 가입 연도 기준 FE 자동 산출.
        faculty:
          type: string
          example: 컴퓨터학부
          description: 학부. 자유 입력 텍스트(고정 enum 아님).
        phone:
          type: string
          example: 010-1234-5678
          description: 휴대전화. 하이픈 포함 형식으로 저장.
        enrolled:
          type: boolean
          example: true
          description: >
            재학여부. 서버가 가입 시 MemberStatus로 파생한다
            (true→ACTIVE, false→ON_LEAVE). WITHDRAWN은 가입 시 도달 불가·admin만 설정.
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    PasswordResetConfirm:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, format: password }

    # ── people ──
    PersonMember:
      type: object
      required: [name, role]
      properties:
        name: { type: string }
        role: { type: string, description: 직책 표시 텍스트 (예 회장·전 학술부장) }
        gen: { type: [string, 'null'], example: '41기' }
        bio: { type: [string, 'null'] }
        githubUrl: { type: [string, 'null'], format: uri }
        blogUrl: { type: [string, 'null'], format: uri }
    PeopleGroup:
      type: object
      required: [heading, members]
      properties:
        heading: { type: [string, 'null'], description: 부서명 (contrib/grad는 null) }
        members:
          type: array
          items: { $ref: '#/components/schemas/PersonMember' }
    PeopleTab:
      type: object
      required: [desc, empty, groups]
      properties:
        desc: { type: string }
        empty: { type: string }
        groups:
          type: array
          items: { $ref: '#/components/schemas/PeopleGroup' }
    PeopleResponse:
      type: object
      required: [exec, contrib, grad]
      properties:
        exec: { $ref: '#/components/schemas/PeopleTab' }
        contrib: { $ref: '#/components/schemas/PeopleTab' }
        grad: { $ref: '#/components/schemas/PeopleTab' }

    # ── seminar ──
    Seminar:
      type: object
      required: [id, title, startsAt, status]
      properties:
        id: { type: string }
        title: { type: string }
        speaker: { type: [string, 'null'] }
        topic: { type: [string, 'null'] }
        startsAt: { type: string, format: date-time, description: 정규 시작 시각 (ISO-8601) }
        day: { type: string, description: 파생 표시 (예 '27') }
        month: { type: string, description: 파생 표시 (예 '6월') }
        weekday: { type: string, description: 파생 표시 (예 '금') }
        time: { type: string, description: 파생 표시 (예 '19:00') }
        place: { type: [string, 'null'] }
        mode: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/SeminarStatus' }
        materialUrl: { type: [string, 'null'], format: uri }
        capacity: { type: [integer, 'null'] }
    SeminarCreateRequest:
      type: object
      required: [title, startsAt]
      properties:
        title: { type: string }
        speaker: { type: [string, 'null'] }
        topic: { type: [string, 'null'] }
        startsAt: { type: string, format: date-time }
        place: { type: [string, 'null'] }
        mode: { type: [string, 'null'] }
        attendanceCode: { type: [string, 'null'], description: 출석 코드 (응답엔 미노출) }
        materialUrl: { type: [string, 'null'], format: uri }
        capacity: { type: [integer, 'null'] }
    AttendRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }
    AttendResult:
      type: object
      required: [seminarId, at]
      properties:
        seminarId: { type: string }
        at: { type: string, description: 출석 시각 표시 (예 '19:02') }
    RosterEntry:
      type: object
      required: [name, sid, at]
      properties:
        name: { type: string }
        sid: { type: string, description: 학번 }
        at: { type: string, description: 출석 시각 표시 (예 '19:02') }
    RosterResponse:
      type: object
      required: [title, cap, list]
      properties:
        title: { type: string }
        cap: { type: integer, description: 정원 }
        list:
          type: array
          items: { $ref: '#/components/schemas/RosterEntry' }

    # ── study ──
    Study:
      type: object
      required: [id, title, fields, leader, cur, cap, status]
      properties:
        id: { type: string }
        title: { type: string }
        fields:
          type: array
          items: { type: string }
        leader: { type: string, description: leader 이름 }
        schedule: { type: [string, 'null'] }
        period: { type: [string, 'null'] }
        mode: { type: [string, 'null'] }
        cur: { type: integer, description: 현재 인원 (파생) }
        cap: { type: integer, description: 정원 }
        status: { $ref: '#/components/schemas/StudyStatus' }
        apply: { $ref: '#/components/schemas/ApplyState' }
    StudyCreateRequest:
      type: object
      required: [title, fields, capacity]
      properties:
        title: { type: string }
        fields:
          type: array
          items: { type: string }
        capacity: { type: integer, minimum: 1 }
        schedule: { type: [string, 'null'] }
        period: { type: [string, 'null'] }
        mode: { type: [string, 'null'] }
        intro: { type: [string, 'null'] }
    ApplyRequest:
      type: object
      required: [motive]
      properties:
        motive: { type: string, description: 지원 동기 (필수) }
    MyApp:
      type: object
      required: [id, studyId, title, status]
      properties:
        id: { type: string }
        studyId: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/ApplicationStatus' }
        reason: { type: [string, 'null'], description: 거절 사유 }
    MyStudy:
      type: object
      required: [id, title, approvalStatus, status]
      properties:
        id: { type: string }
        title: { type: string }
        approvalStatus: { $ref: '#/components/schemas/ApprovalStatus' }
        status: { $ref: '#/components/schemas/StudyStatus' }
        reason: { type: [string, 'null'], description: 반려 사유 }
    MyActivity:
      type: object
      required: [apps, studies]
      properties:
        apps:
          type: array
          items: { $ref: '#/components/schemas/MyApp' }
        studies:
          type: array
          items: { $ref: '#/components/schemas/MyStudy' }
    PendingStudy:
      type: object
      required: [id, title, fields, creator, capacity, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        fields:
          type: array
          items: { type: string }
        creator: { type: string, description: 개설자 이름 }
        capacity: { type: integer }
        schedule: { type: [string, 'null'] }
        period: { type: [string, 'null'] }
        intro: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    Applicant:
      type: object
      required: [id, studyId, studyTitle, name, studentId, motive, createdAt]
      properties:
        id: { type: string, description: 스터디 신청 ID }
        studyId: { type: string }
        studyTitle: { type: string }
        name: { type: string }
        studentId: { type: string }
        motive: { type: string }
        createdAt: { type: string, format: date-time }
    PendingMember:
      type: object
      required: [id, name, studentId, email, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        studentId: { type: string }
        email: { type: string, format: email }
        createdAt: { type: string, format: date-time }

    # ── admin (management surface) ──
    AdminResource:
      type: string
      enum: [members, seminars, studies]
      description: 관리 리소스. members는 tab으로 세부 구분.
    AdminListResponse:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
            description: 리소스별 행. 필드는 FE 화면 스키마(admin.data SCHEMAS)를 따르며 enum 필드는 와이어 키(UPPER_SNAKE).
        page: { type: integer }
        size: { type: integer }
        total: { type: integer }
    AdminBatchRequest:
      type: object
      properties:
        updates:
          type: array
          items:
            type: object
            required: [id, fields]
            properties:
              id: { type: string }
              version: { type: [integer, 'null'], description: 낙관적 잠금 버전 }
              fields: { type: object, additionalProperties: true }
        creates:
          type: array
          items:
            type: object
            required: [tempId, fields]
            properties:
              tempId: { type: string, description: 클라이언트 임시 ID (응답의 서버 ID와 매핑) }
              fields: { type: object, additionalProperties: true }
        deletes:
          type: array
          items: { type: string }
    AdminBatchResponse:
      type: object
      required: [updated, created, deleted]
      properties:
        updated:
          type: array
          items:
            type: object
            required: [id]
            properties:
              id: { type: string }
        created:
          type: array
          items:
            type: object
            required: [tempId, id]
            properties:
              tempId: { type: string }
              id: { type: string }
        deleted:
          type: array
          items: { type: string }
        conflicts:
          type: array
          description: 버전 충돌 행 (부분 성공)
          items:
            type: object
            required: [id]
            properties:
              id: { type: string }
              message: { type: [string, 'null'] }
        errors:
          type: array
          description: 검증 실패 행 (부분 성공)
          items:
            type: object
            properties:
              id: { type: [string, 'null'], description: update는 id, create는 tempId }
              fieldErrors:
                type: object
                additionalProperties: { type: string }
    DashboardStats:
      type: object
      required: [totalMembers, alumniCount, seminarAttendanceRate, studyAttendanceRate]
      properties:
        totalMembers: { type: integer }
        alumniCount: { type: integer }
        seminarAttendanceRate: { type: integer, description: 백분율 }
        studyAttendanceRate: { type: integer, description: 백분율 }
        deltas:
          type: object
          properties:
            members: { type: integer }
            seminarRate: { type: integer }
            studyRate: { type: integer }
        gradeBreakdown:
          type: object
          description: 등급별 인원 (표시용 집계 키)
          properties:
            probationary: { type: integer }
            associate: { type: integer }
            regular: { type: integer }
        cohortBreakdown:
          type: array
          items:
            type: object
            required: [cohort, count]
            properties:
              cohort: { type: integer }
              count: { type: integer }
        attendanceTrend:
          type: array
          items:
            type: object
            required: [month, seminar, study]
            properties:
              month: { type: string }
              seminar: { type: integer }
              study: { type: integer }
        pendingApplications: { type: integer }
        pendingBreakdown:
          type: object
          description: 승인 대기 집계 (gen 파생 표시용)
          properties:
            freshman: { type: integer }
            enrolled: { type: integer }
    AdminSettings:
      type: object
      required: [semester, currentCohort, autoPromote, driveConnected]
      properties:
        semester: { type: string, example: '2026-2학기' }
        currentCohort: { type: integer, example: 41 }
        autoPromote: { type: boolean }
        driveConnected: { type: boolean }
        driveFolder: { type: [string, 'null'] }
    AdminSettingsUpdate:
      type: object
      properties:
        semester: { type: string }
        currentCohort: { type: integer }
        autoPromote: { type: boolean }
    DriveExportRequest:
      type: object
      required: [resource]
      properties:
        resource: { type: string, description: 리소스 경로 (members/seminars/studies) }
        filters: { type: [object, 'null'], additionalProperties: true }
        columns: { type: [array, 'null'], items: { type: string } }
    DriveExportResult:
      type: object
      required: [fileUrl, fileId]
      properties:
        fileUrl: { type: string, format: uri }
        fileId: { type: string }
